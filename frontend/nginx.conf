server {
  listen 80;
  root /usr/share/nginx/html;
  client_max_body_size 10m;   # GeoJSON/KML area uploads

  # Server-Sent Events must not be buffered
  location /api/queries/ {
    proxy_pass http://backend:4000;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }
  location /api/ {
    proxy_pass http://backend:4000;
    proxy_http_version 1.1;
    # live data checks (sources/check, compile on a new district) can take minutes
    proxy_read_timeout 330s;
  }
  location / {
    try_files $uri /index.html;
  }
}
