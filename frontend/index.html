<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Bhu-Drishti: satellite monitoring of floods, fires and construction for every district in India, with stated uncertainty and reports for officials." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Public+Sans:wght@400;600;800&display=swap" rel="stylesheet" />
    <meta name="theme-color" content="#050507" />
    <title>Bhu-Drishti</title>
    <script>
      // pick the theme before first paint so there is no dark/light flash (mirrors src/theme.tsx)
      (function () {
        var m = null;
        try { m = localStorage.getItem("bd-theme"); } catch (e) {}
        if (m !== "light" && m !== "dark") m = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        document.documentElement.dataset.theme = m;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
