# Render Blueprint: deploys Bhu-Drishti without managing a server.
# Render → New → Blueprint → pick this repository. Step-by-step guide: DEPLOY.md, "Option A".
#
#   Internet ──HTTPS──▶ bhu-drishti-web (public: website + /api proxy)
#                            │ private network
#                            ▼
#                       bhu-drishti-backend (private: API, SQLite on a disk) ──▶ bhu-drishti-engine (private: AEQE)
#
# Frankfurt is the closest Render region to the satellite archives (Planetary Computer, West Europe),
# which makes live questions several times faster than a region in Asia or the US.

services:
  # ---------------------------------------------------------------- website (the only public service)
  - type: web
    name: bhu-drishti-web
    runtime: docker
    region: frankfurt
    plan: 0.5c-512mb
    dockerContext: ./frontend
    dockerfilePath: ./frontend/Dockerfile
    healthCheckPath: /
    autoDeployTrigger: checksPass        # deploy a new commit on main only after CI is green
    branch: main
    envVars:
      - key: API_HOSTPORT                 # nginx forwards /api/… here over Render's private network
        fromService:
          name: bhu-drishti-backend
          type: pserv
          property: hostport

  # ---------------------------------------------------------------- API (private)
  - type: pserv
    name: bhu-drishti-backend
    runtime: docker
    region: frankfurt
    plan: 0.5c-512mb
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    autoDeployTrigger: checksPass
    branch: main
    disk:                                # users, projects, reports (SQLite) survive deploys and restarts
      name: backend-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: ENGINE_HOSTPORT
        fromService:
          name: bhu-drishti-engine
          type: pserv
          property: hostport
      - key: JWT_SECRET                  # random 256-bit secret generated by Render
        generateValue: true
      - key: SQLITE_PATH
        value: /data/bhu-drishti.sqlite
      - key: ALLOW_GUEST
        value: "false"
      - key: TRUST_PROXY                 # Render's proxy + the web container
        value: "2"
      - key: MAX_CONCURRENT_RUNS
        value: "2"
      - key: MONITOR_SCHEDULER
        value: "true"
      - key: REPORT_DELIVERY
        value: smtp
      - key: PUBLIC_APP_URL              # e.g. https://bhu-drishti-web.onrender.com (or your own domain)
        sync: false
      - key: CORS_ORIGIN                 # same value as PUBLIC_APP_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: REPORT_AUTO_EMAIL           # every new report is emailed here (comma-separated)
        sync: false

  # ---------------------------------------------------------------- AEQE engine (private)
  - type: pserv
    name: bhu-drishti-engine
    runtime: docker
    region: frankfurt
    plan: 1c-2g                          # live raster reads need ~2 GB memory
    dockerContext: ./engine
    dockerfilePath: ./engine/Dockerfile
    autoDeployTrigger: checksPass
    branch: main
    disk:                                # saved answers, traces, district tiles and the tile cache
      name: engine-data
      mountPath: /data
      sizeGB: 5
    envVars:
      - key: PORT
        value: "8000"
      - key: AEQE_PROVIDER
        value: auto
      - key: AEQE_SEQUENTIAL
        value: spending
      - key: GDAL_HTTP_MAX_RETRY
        value: "4"
      - key: GDAL_HTTP_RETRY_DELAY
        value: "2"
      - key: GDAL_HTTP_RETRY_CODES
        value: ALL
      - key: GDAL_HTTP_TIMEOUT
        value: "60"
      - key: NASA_FIRMS_MAP_KEY          # fires: https://firms.modaps.eosdis.nasa.gov/api/map_key/
        sync: false
      - key: CDSE_CLIENT_ID              # Copernicus Data Space OAuth client
        sync: false
      - key: CDSE_CLIENT_SECRET
        sync: false
      - key: EARTHDATA_TOKEN             # NASA Earthdata token
        sync: false
      - key: GOOGLE_CLOUD_PROJECT_ID     # optional: Earth Engine (AlphaEarth); leave empty to skip
        sync: false
      - key: GOOGLE_APPLICATION_CREDENTIALS   # add the JSON as a Secret File named service-account.json
        value: /etc/secrets/service-account.json
