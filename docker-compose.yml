# Bhu-Drishti in one container (website + API + AEQE engine), built from ./Dockerfile.
#   docker compose up -d --build   →   http://localhost:8080
# Settings come from .env (copy .env.example); everything is optional, the app starts without it.
services:
  app:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      PORT: "7860"
    ports: ["${WEB_PORT:-8080}:7860"]
    volumes:
      - app-data:/home/user/data                                   # SQLite accounts/reports + engine results
      - ./engine/credentials:/home/user/app/engine/credentials:ro  # optional Earth Engine service-account JSON
    restart: unless-stopped

  # Optional: self-hosted automation for report e-mails (import n8n/bhu-drishti-reports.json).
  #   docker compose --profile n8n up -d n8n   →   http://localhost:5678 (and set ALLOW_PRIVATE_WEBHOOKS=true)
  n8n:
    image: n8nio/n8n:1.80.3
    environment:
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      GENERIC_TIMEZONE: Asia/Kolkata
      TZ: Asia/Kolkata
      NODE_FUNCTION_ALLOW_BUILTIN: crypto
      N8N_SECURE_COOKIE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_RUNNERS_ENABLED: "true"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
    volumes:
      - n8n-data:/home/node/.n8n
      - ./n8n:/workflows:ro
    ports: ["127.0.0.1:5678:5678"]
    restart: unless-stopped
    profiles: ["n8n"]

volumes:
  app-data:
  n8n-data:
