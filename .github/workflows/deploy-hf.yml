name: Deploy to Hugging Face

# Publishes the app to a free Hugging Face Docker Space after CI passes on main.
# One-time setup (DEPLOY.md): create the Space, then in GitHub → Settings → Secrets and variables → Actions add
#   secret   HF_TOKEN   a Hugging Face access token with "write" permission
#   variable HF_SPACE   the Space's id, e.g. your-hf-name/bhu-drishti
# Until HF_SPACE is set this workflow does nothing.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hf
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      vars.HF_SPACE != '' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Assemble the Space (only what the container needs)
        run: |
          mkdir space
          cp -r Dockerfile .dockerignore start.sh frontend backend engine space/
          rm -rf space/engine/tests space/engine/bench space/engine/scripts space/engine/credentials \
                 space/backend/test space/frontend/scripts
          # Hugging Face reads the Space settings from the README's front matter
          cat > space/README.md <<'EOF'
          ---
          title: Bhu-Drishti
          emoji: 🛰️
          colorFrom: blue
          colorTo: yellow
          sdk: docker
          app_port: 7860
          pinned: false
          short_description: Satellite answers for every district in India
          ---

          Bhu-Drishti: ask about floods, farm fires and new construction anywhere in India and get an answer from
          live satellite data, with its uncertainty stated. Source code and docs:
          https://github.com/${{ github.repository }}
          EOF

      - name: Push to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          cd space
          git init -q -b main
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7} from GitHub"
          # the Space only mirrors main, so its history is replaced on every deploy
          git push --force "https://${HF_SPACE%%/*}:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" main
          echo "Deployed to https://huggingface.co/spaces/${HF_SPACE}"
